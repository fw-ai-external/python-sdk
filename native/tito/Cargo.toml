[package]
name = "fireworks-tito-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
itoa = "1"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
